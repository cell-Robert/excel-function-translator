<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Function Translator</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
    background:#f5f5f5;
}

.container{
    background:white;
    padding:20px;
    border-radius:8px;
}

textarea{
    width:100%;
    min-height:180px;
    box-sizing:border-box;
}

button{
    background:#107c41;
    color:white;
    border:none;
    padding:10px 20px;
    margin:10px 5px 10px 0;
    cursor:pointer;
    border-radius:4px;
}

button:hover{
    background:#0d6635;
}
</style>
</head>

<body>

<div class="container">

<h1>Excel Function Translator</h1>

<p>Översätt Excel-funktioner mellan svenska och engelska.</p>

<textarea id="inputFormula"></textarea>

<br>

<button id="svToEn">Svenska → Engelska</button>
<button id="enToSv">Engelska → Svenska</button>

<h3>Resultat</h3>

<textarea id="outputFormula"></textarea>

</div>



</body>
</html>
